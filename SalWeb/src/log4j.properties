#debug/info/warn/error/fatal for log4j 1.2.9
#ALL/DEBUG/INFO/WARN/ERROR/FATAL/OFF/TRACE log level for log4j1.2.12 and 1.3
log4j.rootLogger=INFO, SPRINGStdout, SPRINGDaily, SPRINGEmail

log4j.appender.SPRINGStdout=org.apache.log4j.ConsoleAppender
log4j.appender.SPRINGStdout.layout=org.apache.log4j.PatternLayout
log4j.appender.SPRINGStdout.layout.ConversionPattern=%-d{yyyy-MM-dd HH:mm:ss} [%c]-[%p] %m%n

log4j.appender.SPRINGDaily=org.apache.log4j.DailyRollingFileAppender
#log4j.appender.SPRINGDaily.File=D:\\MgrServerAPLog\\SAL\\Sal.log
log4j.appender.SPRINGDaily.File=/MgrServerAPLog/Sal/Sal.log
log4j.appender.SPRINGDaily.DatePattern='.'yyyy-MM-dd
log4j.appender.SPRINGDaily.layout=org.apache.log4j.PatternLayout
log4j.appender.SPRINGDaily.layout.ConversionPattern=%-d{yyyy-MM-dd HH:mm:ss} [%c]-[%p] %m%n

log4j.appender.SPRINGEmail.Threshold=FATAL
log4j.appender.SPRINGEmail = org.apache.log4j.net.SMTPAppender
log4j.appender.SPRINGEmail.BufferSize = 100
log4j.appender.SPRINGEmail.From = sal@vghks.gov.tw
log4j.appender.SPRINGEmail.To = hjtsao@vghks.gov.tw
log4j.appender.SPRINGEmail.SMTPHost = isca.vghks.gov.tw
log4j.appender.SPRINGEmail.Subject = OPG System Exception
log4j.appender.SPRINGEmail.layout = org.apache.log4j.PatternLayout
log4j.appender.SPRINGEmail.layout.conversionPattern = %d %-5p [%-10t] %c{2} - %m%n